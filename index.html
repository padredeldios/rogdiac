<style>
  :root{

  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:var(--sans);background:var(--cream);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  img{display:block;width:100%;height:100%;object-fit:cover}

  /* top bar */
  .topbar{background:var(--ink);color:#e9e3da;font-size:.8rem;padding:7px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

  .langs button{background:none;border:1px solid transparent;color:#e9e3da;font:inherit;font-size:.75rem;padding:2px 8px;border-radius:12px;cursor:pointer;letter-spacing:.05em}
  .langs button.active{border-color:#e9e3da}

  /* header */
  header{position:sticky;top:0;z-index:20;background:rgba(246,241,234,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .head-in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none}
  .brand svg{width:34px;height:34px}
  .brand span{font-family:var(--serif);font-size:1.55rem;font-weight:600;color:var(--pom);letter-spacing:.02em}
  .mainnav{display:flex;gap:22px;align-items:center}
  .mainnav a{text-decoration:none;font-size:.92rem;color:var(--ink)}
  .mainnav a:hover{color:var(--pom)}
  .mainnav a.btn,.mainnav a.btn:hover{color:#fff}
  .btn{display:inline-block;text-decoration:none;font-weight:600;font-size:.9rem;padding:11px 22px;border-radius:999px;border:1.5px solid var(--pom);background:var(--pom);color:#fff;cursor:pointer;transition:.2s}
  .btn:hover{background:var(--pom-dark);border-color:var(--pom-dark)}
  .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.8)}
  .btn.ghost:hover{background:rgba(255,255,255,.12)}
  .btn.outline{background:transparent;color:var(--pom)}
  .btn.outline:hover{background:var(--pom);color:#fff}
  @media (max-width:760px){.mainnav a.nl{display:none}.brand span{font-size:1.3rem}}

  /* photo slots */
  .ph{position:relative;overflow:hidden;background:linear-gradient(135deg,#c9b8a3,#8a9a9c)}
  .ph .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;color:rgba(255,255,255,.92);font-size:.85rem;letter-spacing:.04em}
  .ph .lbl::before{content:"";position:absolute;inset:10px;border:1px dashed rgba(255,255,255,.55);border-radius:6px}

  html[lang=el] .eyebrow,html[lang=el] .space-txt .time{text-transform:none}
  /* hero */
  .hero{position:relative;min-height:min(88vh,780px);display:flex;align-items:flex-end;color:#fff}
  .hero .ph{position:absolute;inset:0;background:radial-gradient(ellipse at 75% 30%,rgba(142,27,44,.55),transparent 55%),linear-gradient(160deg,#2c6577 0%,#1f4e5f 45%,#132f39 100%)}
  .hero .ph .lbl{align-items:flex-start;padding-top:40px}
  .hero .ph .lbl::before{display:none}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.55),rgba(0,0,0,0) 60%),linear-gradient(to right,rgba(0,0,0,.35),rgba(0,0,0,0) 55%)}

  .hero p{max-width:46ch;opacity:.92;font-size:1.05rem}
  .hero .cta{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}

  /* generic section */
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}
  .sec{padding:90px 0}
  .sec-title{font-family:var(--serif);font-weight:400;font-size:clamp(1.9rem,4vw,2.8rem);line-height:1.15;color:var(--ink)}
  .sec-sub{color:var(--muted);margin-top:10px;max-width:56ch}
  .center{text-align:center}.center .sec-sub{margin-left:auto;margin-right:auto}

  /* intro */

  .intro p.big{font-family:var(--serif);font-size:clamp(1.3rem,2.6vw,1.75rem);line-height:1.5;max-width:34ch;margin:0 auto;color:var(--ink)}
  .intro .pom{width:44px;margin:0 auto 22px}

  .space{display:grid;grid-template-columns:1.1fr 1fr;gap:56px;align-items:center;padding:60px 0}
  .space.rev .space-txt{order:-1}
  .space-txt .time{display:inline-block;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--pom);border:1px solid var(--pom);border-radius:999px;padding:4px 12px;margin-bottom:16px}
  .space-txt h3{font-family:var(--serif);font-weight:400;font-size:2rem;line-height:1.2;margin-bottom:14px}
  .space-txt p{color:var(--muted)}
  .strip{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:10px;height:440px}
  .strip .ph{border-radius:6px}
  .strip .ph:first-child{grid-row:1/3}
  @media (max-width:860px){.space{grid-template-columns:1fr;gap:26px;padding:40px 0}.space.rev .space-txt{order:0}.strip{height:320px}}

  /* menu */
  .menu-sec{background:var(--paper)}
  .tabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:34px 0 30px}
  .tabs button{font:inherit;font-size:.9rem;background:none;border:1px solid var(--line);color:var(--ink);padding:8px 18px;border-radius:999px;cursor:pointer}
  .tabs button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .menu-list{max-width:760px;margin:0 auto}
  .mi{display:flex;justify-content:space-between;gap:20px;padding:16px 0;border-bottom:1px dotted #cfc4b5}
  .mi .n{font-weight:600}
  .mi .d{color:var(--muted);font-size:.9rem;margin-top:2px}
  .mi .p{font-family:var(--serif);font-size:1.15rem;white-space:nowrap;color:var(--pom)}
  .tag{display:inline-block;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:1px 8px;margin:6px 4px 0 0;color:var(--muted)}
  .menu-note{text-align:center;color:var(--muted);font-size:.82rem;margin-top:26px}

  /* booking */
  .book{background:var(--pom);color:#fff;text-align:center}
  .book .sec-title{color:#fff}
  .book .sec-sub{color:rgba(255,255,255,.85)}
  .book .cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:30px}
  .book .btn{background:#fff;color:var(--pom);border-color:#fff}
  .book .btn:hover{background:var(--cream)}
  .book .num{margin-top:18px;font-size:.95rem;opacity:.9;letter-spacing:.04em}

  /* location */
  .loc{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:stretch}
  .loc .ph{border-radius:6px;min-height:340px;background:linear-gradient(135deg,#d8cdbd,#a9b7b4)}
  .hours{margin-top:24px;border-top:1px solid var(--line)}
  .hours div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:.95rem}
  .loc address{font-style:normal;margin-top:16px;color:var(--muted)}
  .loc .btn{margin-top:26px}
  @media (max-width:860px){.loc{grid-template-columns:1fr}}

  /* footer */
  footer{background:var(--ink);color:#cfc8be;padding:50px 20px 34px;text-align:center;font-size:.88rem}
  footer .brand{justify-content:center;margin-bottom:14px}
  footer .brand span{color:#fff}
  .social{display:flex;gap:18px;justify-content:center;margin:16px 0}
  .social a{text-decoration:none;color:#fff;opacity:.85}
  .social a:hover{opacity:1}
  footer small{display:block;margin-top:20px;opacity:.6}
</style>

  hoursT:   {el:"Ωράριο",en:"Opening hours",de:"Öffnungszeiten",fr:"Horaires"}
};
/* ===================================================================== */
</script>

<div class="topbar">

  <div class="langs" id="langs"></div>
</div>

<header>
  <div class="head-in">

      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M17 6.5l3 3 3-3 .2 4.2A13 13 0 1 1 16.8 10.7z" fill="#8e1b2c"/><circle cx="16" cy="22" r="1.6" fill="#f6f1ea"/><circle cx="22" cy="20" r="1.6" fill="#f6f1ea"/><circle cx="20" cy="26" r="1.6" fill="#f6f1ea"/><circle cx="25" cy="25" r="1.6" fill="#f6f1ea"/></svg>

</footer>

<script>
const FLAGS = { el:"ΕΛ", en:"EN", de:"DE", fr:"FR", it:"IT" };
const t = (o, l) => (o && (o[l] || o[SITE.defaultLang] || o.en)) || "";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const fmt = p => p.toFixed(2).replace(".", ",") + " " + SITE.currency;
const photo = p => p.src ? `<img src="${esc(p.src)}" alt="${esc(p.label)}" loading="lazy">` : `<span class="lbl">${esc(p.label)}</span>`;
const $ = id => document.getElementById(id);
let lang, activeCat = MENU[0].id;

function pickLang(){
  let saved = null;
  try { saved = localStorage.getItem("lang"); } catch(e){}
  const fromUrl = new URLSearchParams(location.search).get("lang");
  for (const c of [fromUrl, saved, (navigator.language||"").slice(0,2)])
    if (SITE.languages.includes(c)) return c;
  return SITE.defaultLang;
}

function renderMenu(){
  $("tabs").innerHTML = MENU.map(c =>
    `<button class="${c.id===activeCat?"active":""}" onclick="setCat('${c.id}')">${esc(t(c.title, lang))}</button>`).join("");
  const cat = MENU.find(c => c.id === activeCat);
  $("menuList").innerHTML = cat.items.map(i => `
    <div class="mi">
      <div>
        <div class="n">${esc(t(i.name, lang))}</div>
        ${i.desc ? `<div class="d">${esc(t(i.desc, lang))}</div>` : ""}
        ${i.tags ? i.tags.map(g => `<span class="tag">${esc(t(TAGS[g], lang))}</span>`).join("") : ""}
      </div>
      <div class="p">${fmt(i.price)}</div>
    </div>`).join("");
}

function render(){
  document.documentElement.lang = lang;
  document.querySelectorAll(".site-name").forEach(e => e.textContent = SITE.name);
  document.querySelectorAll("[data-t]").forEach(e => e.textContent = t(UI[e.dataset.t], lang));
  $("openTxt").textContent = t(UI.open, lang);
  $("langs").innerHTML = SITE.languages.map(l =>
    `<button class="${l===lang?"active":""}" onclick="setLang('${l}')">${FLAGS[l]||l.toUpperCase()}</button>`).join("");

  $("heroPh").innerHTML = photo(SITE.hero);
  $("locPh").innerHTML = photo(SITE.locationPhoto);

  $("spacesList").innerHTML = SPACES.map((s, i) => `
    <div class="space ${i % 2 ? "rev" : ""}">
      <div class="strip">${s.photos.map(p => `<div class="ph">${photo(p)}</div>`).join("")}</div>
      <div class="space-txt">
        <span class="time">${esc(t(s.time, lang))}</span>
        <h3>${esc(t(s.title, lang))}</h3>
        <p>${esc(t(s.text, lang))}</p>
      </div>
    </div>`).join("");

  renderMenu();

  const tel = SITE.phone.replace(/\s/g, "");
  $("bookBtns").innerHTML =
    `<a class="btn" href="tel:${tel}">${esc(t(UI.call, lang))}</a>` +
    (SITE.whatsapp ? `<a class="btn" href="https://wa.me/${SITE.whatsapp}" target="_blank" rel="noopener">${esc(t(UI.wa, lang))}</a>` : "");
  $("bookNum").textContent = SITE.phone;

  $("addr").textContent = t(SITE.address, lang);
  $("hours").innerHTML = `<div><strong>${esc(t(UI.hoursT, lang))}</strong><span></span></div>` +
    SITE.hours.map(h => `<div><span>${esc(t(h.d, lang))}</span><span>${h.h}</span></div>`).join("");
  $("mapsBtn").href = SITE.mapsUrl;

  $("footAddr").textContent = t(SITE.address, lang) + " · " + SITE.phone;
  $("social").innerHTML =
    (SITE.instagram ? `<a href="${SITE.instagram}" target="_blank" rel="noopener">Instagram</a>` : "") +
    (SITE.facebook ? `<a href="${SITE.facebook}" target="_blank" rel="noopener">Facebook</a>` : "");
  $("yr").textContent = new Date().getFullYear();
  document.title = SITE.name + " — Café Restaurant";
}

function setLang(l){ lang = l; try { localStorage.setItem("lang", l); } catch(e){} render(); }
function setCat(id){ activeCat = id; renderMenu(); }

lang = pickLang();
render();
</script>
</body>
</html>
